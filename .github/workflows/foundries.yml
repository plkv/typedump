name: Foundries

# Daily crawl of the foundry sites for /foundries, then a build and deploy of
# the whole site. macOS because the crawler reads the type in each picture with
# Apple's Vision framework; the runner is free for a public repository. The new
# image copies, the OCR cache and foundry-fonts.json are committed back, so a
# local build after `git pull` has the same page.
#
# Run by hand from the Actions tab: "Foundries" → Run workflow.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: foundries
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  crawl:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crawl
        run: node scripts/foundries/index.mjs

      # Without a token the crawl is still committed; the site then picks it up
      # at the next deploy from a Mac.
      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy out --project-name typedump --branch main

      - name: Commit the crawl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/foundry-fonts.json public/foundry-images scripts/foundries/text-cache.json
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git commit -m "Foundries: daily crawl $(date -u +%F)"
          git pull --rebase
          git push
